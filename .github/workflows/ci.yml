name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    # Keep browser shards separate from format, type, and unit checks.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: browser 1 of 3
            shard: 1/3
          - suite: browser 2 of 3
            shard: 2/3
          - suite: browser 3 of 3
            shard: 3/3
          - suite: performance
          - suite: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Static FFmpeg from GitHub instead of apt: Ubuntu mirrors can stall apt-get until the job times out.
      - name: Install FFmpeg
        timeout-minutes: 3
        run: |
          mkdir -p ~/ffmpeg && cd ~/ffmpeg
          release=https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1
          curl -fsSL --retry 3 --max-time 60 -o ffmpeg.gz "$release/ffmpeg-linux-x64.gz" -o ffprobe.gz "$release/ffprobe-linux-x64.gz"
          sha256sum -c <<'EOF'
          bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa  ffmpeg.gz
          25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067  ffprobe.gz
          EOF
          gunzip ffmpeg.gz ffprobe.gz
          chmod +x ffmpeg ffprobe
          ./ffmpeg -version | head -1
          echo "$PWD" >> "$GITHUB_PATH"
      # The runner image already ships Chromium's system libraries, so skip --with-deps and its apt-get.
      - run: bunx playwright install chromium
        timeout-minutes: 5
      - name: Set browser paths
        run: |
          browser=$(bun -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')
          echo "CUTROOM_BROWSER_PATH=$browser" >> "$GITHUB_ENV"
          echo "HYPERFRAMES_BROWSER_PATH=$browser" >> "$GITHUB_ENV"
      - if: matrix.suite == 'checks'
        run: bun run format:check
      - if: matrix.suite == 'checks'
        run: bun run check
      - if: matrix.suite == 'checks'
        run: bun test
      - if: matrix.shard
        run: bun run test:e2e --shard=${{ matrix.shard }} --reporter=list
      - if: matrix.suite == 'performance'
        run: bun run test:perf --reporter=list
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ strategy.job-index }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
