name: CI

# A PR runs once, on the merge with main; main runs again after each landing.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hyperframes:
    name: Build HyperFrames packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      cache-key: ${{ steps.inputs.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - id: inputs
        env:
          HASH: ${{ hashFiles('vendor/hyperframes/**', 'vendor/@hyperframes/*/package.json', 'patches/@hyperframes*.patch', 'scripts/build-hyperframes.ts') }}
        run: echo "key=hyperframes-${{ runner.os }}-${{ runner.arch }}-bun1.4.4-node24-$HASH" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: packages
        with:
          key: ${{ steps.inputs.outputs.key }}
          path: |
            vendor/@hyperframes/.build-id
            vendor/@hyperframes/*/dist
            vendor/@hyperframes/*/LICENSE
            vendor/@hyperframes/*/README.md
            vendor/@hyperframes/core/docs
            vendor/@hyperframes/core/schemas
      - if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - if: steps.packages.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - if: steps.packages.outputs.cache-hit != 'true'
        run: bun run build:hyperframes

  verify:
    name: verify (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    needs: hyperframes
    # Allow a local build if the shared package cache cannot be restored.
    timeout-minutes: 33
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: browser 1 of 4
            shard: 1/4
          - suite: browser 2 of 4
            shard: 2/4
          - suite: browser 3 of 4
            shard: 3/4
          - suite: browser 4 of 4
            shard: 4/4
          - suite: performance
          - suite: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache/restore@v4
        with:
          key: ${{ needs.hyperframes.outputs.cache-key }}
          path: |
            vendor/@hyperframes/.build-id
            vendor/@hyperframes/*/dist
            vendor/@hyperframes/*/LICENSE
            vendor/@hyperframes/*/README.md
            vendor/@hyperframes/core/docs
            vendor/@hyperframes/core/schemas
      - run: bun install --frozen-lockfile
      # Static FFmpeg from GitHub instead of apt: Ubuntu mirrors can stall apt-get until the job times out.
      - name: Install FFmpeg
        timeout-minutes: 3
        run: |
          mkdir -p ~/ffmpeg && cd ~/ffmpeg
          release=https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1
          curl -fsSL --retry 3 --max-time 60 -o ffmpeg.gz "$release/ffmpeg-linux-x64.gz" -o ffprobe.gz "$release/ffprobe-linux-x64.gz"
          sha256sum -c <<'EOF'
          bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa  ffmpeg.gz
          25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067  ffprobe.gz
          EOF
          gunzip ffmpeg.gz ffprobe.gz
          chmod +x ffmpeg ffprobe
          ./ffmpeg -version | head -1
          echo "$PWD" >> "$GITHUB_PATH"
      # The runner image already ships Chromium's system libraries, so skip --with-deps and its apt-get.
      - run: bunx playwright install chromium
        timeout-minutes: 5
      - name: Set browser paths
        run: |
          browser=$(bun -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')
          echo "CUTROOM_BROWSER_PATH=$browser" >> "$GITHUB_ENV"
          echo "HYPERFRAMES_BROWSER_PATH=$browser" >> "$GITHUB_ENV"
      - if: matrix.suite == 'checks'
        run: bun run format:check
      - if: matrix.suite == 'checks'
        run: bun run check
      - if: matrix.suite == 'checks'
        run: bun test
      - name: Run browser shard
        if: matrix.shard
        env:
          SHARD: ${{ matrix.shard }}
          # Give the render-heavy end of the suite fewer tests per shard.
          PWTEST_SHARD_WEIGHTS: "36:25:21:18"
        run: bun run test:e2e --shard="$SHARD" --reporter=list,./e2e/teardown-watchdog.ts --global-timeout=1620000
      - if: matrix.suite == 'performance'
        run: bun run test:perf --reporter=list --retries=0
      # Also keep a flaky test's failed first attempt.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-failure-${{ strategy.job-index }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # The one check main's ruleset requires, so the matrix can change without editing the rule.
  gate:
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.verify.result }}" = success
