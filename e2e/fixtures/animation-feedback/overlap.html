<!doctype html>
<html><head><script src="gsap.min.js"></script><style>
html,body{margin:0;background:#111;color:white;font:48px system-ui}
.clip{position:absolute;left:40px}#shot{top:20px}#title{top:150px}#other{top:250px}
</style></head><body>
<main id="main" data-composition-id="main" data-width="640" data-height="360" data-fps="30" data-duration="15">
<div id="shot" class="clip" data-start="0" data-duration="6" data-track-index="0">Footage</div>
<div id="title" class="clip" data-start="4" data-duration="4" data-track-index="1">Ada Lovelace, founder</div>
<div id="other" class="clip" data-start="10" data-duration="4" data-track-index="2">Try it today</div>
</main><script>
const tl=gsap.timeline({paused:true});
tl.fromTo('#title',{opacity:0},{opacity:1,duration:.5,ease:'power2.out'},4);
tl.to('#title',{opacity:0,duration:.3},7.7);
tl.fromTo('#other',{opacity:0},{opacity:1,duration:.5,ease:'power2.out'},10);
window.__timelines.main=tl;
</script></body></html>
