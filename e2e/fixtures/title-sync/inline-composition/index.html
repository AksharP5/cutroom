<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>inline-composition</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        color: #ededed;
        background: #111111;
        font-family: system-ui, sans-serif;
      }
      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .shot {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 220px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.3);
      }
      .lower {
        position: absolute;
        left: 8%;
        bottom: 12%;
        padding: 18px 28px;
        background: #111111;
        color: #ededed;
        font-size: 44px;
        font-weight: 600;
      }
      .cta {
        position: absolute;
        left: 12%;
        right: 12%;
        top: 40%;
        margin: 0;
        font-size: 84px;
        font-weight: 600;
        text-align: center;
      }
    </style>
    <script src="gsap.min.js"></script>
  </head>
  <body>
    <main
      id="main"
      data-composition-id="main"
      data-width="1920"
      data-height="1080"
      data-fps="30"
      data-duration="48"
      class="stage"
    >
      <div
        id="shot-a"
        class="clip shot"
        style="background: #7a1f1f"
        data-start="0"
        data-duration="12"
        data-track-index="0"
        data-label="Shot A"
      >
        A
      </div>
      <div
        id="shot-b"
        class="clip shot"
        style="background: #1f5a7a"
        data-start="12"
        data-duration="18"
        data-track-index="0"
        data-label="Shot B"
      >
        B
      </div>
      <div
        id="shot-c"
        class="clip shot"
        style="background: #2f6b2f"
        data-start="30"
        data-duration="18"
        data-track-index="0"
        data-label="Shot C"
      >
        C
      </div>
      <div
        id="lower"
        class="clip lower"
        data-composition-id="lower"
        data-start="6"
        data-duration="6"
        data-track-index="2"
        data-label="Lower third"
      >
        Ada Lovelace, Founder
      </div>
      <div
        id="cta"
        class="clip cta"
        data-composition-id="cta"
        data-start="36"
        data-duration="4"
        data-track-index="2"
        data-label="Call to action"
      >
        Try it today
      </div>
    </main>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
      {
        const clip = document.getElementById("lower");
        const length = Number(clip.getAttribute("data-duration"));
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          clip,
          { opacity: 0, x: -60 },
          { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" },
          0,
        );
        tl.to(clip, { opacity: 0, duration: 0.4 }, length - 0.4);
        window.__timelines["lower"] = tl;
      }
      {
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          "#cta",
          { scale: 0.9, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5 },
          0,
        );
        window.__timelines["cta"] = tl;
      }
    </script>
  </body>
</html>
